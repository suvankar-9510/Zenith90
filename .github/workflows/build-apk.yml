name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenith90-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Found APK at $APK_PATH"
            cp "$APK_PATH" ./zenith90-debug.apk
            
            gh release delete v1.0.0-preview --yes || true
            gh release create v1.0.0-preview ./zenith90-debug.apk \
              --title "Zenith90 v1.0.0 Preview (Debug APK)" \
              --notes "### ⚡ Zenith90 Preview APK Build
              
              This automated build was compiled via GitHub Actions.
              
              #### How to install for testing:
              1. Download **\`zenith90-debug.apk\`** below on your Android device.
              2. Open the downloaded file and allow 'Install from Unknown Sources' if prompted.
              3. Launch **Zenith90** to begin testing!" \
              --prerelease
          else
            echo "Error: APK not found!"
            exit 1
          fi
