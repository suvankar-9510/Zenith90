name: Build Zenith90 Instant Pixel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Zenith90 Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Downloadable Zenith90-Pixel.apk
        uses: actions/upload-artifact@v4
        with:
          name: Zenith90-Pixel-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish Test APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Found APK at $APK_PATH"
            cp "$APK_PATH" ./zenith90-debug.apk
            
            # Publish to v1.7.0-pixel release
            gh release delete v1.7.0-pixel --yes || true
            gh release create v1.7.0-pixel ./zenith90-debug.apk \
              --title "Zenith90 v1.7.0 Pixel (Material You Monet, Circle Fill & Compact Editors)" \
              --notes "### 🎨 Zenith90 v1.7.0 Instant Pixel APK
              
              Automated build compiled via GitHub Actions.
              
              #### What's New in v1.7.0:
              - **Material You Dynamic Theming**: Full Monet wallpaper synchronization enabled by default on Android 12+ (Pixel devices). All surfaces, text, buttons, and badges dynamically match your system color scheme.
              - **Summary Circle Color Filling**: All 4 Summary tiles now feature dynamic circular color filling indicators with animated arcs and translucent disc fills reflecting actual progress for Wake Anchor, Deep Study, Conditioning, and Equilibrium.
              - **Compact Blueprint Block Editor**: Streamlined block creation and editing dialog with compact time steppers, preset chips, and quick duration selectors.
              - **Direct Blueprint Task Editing**: Added inline edit (pencil) buttons directly on every timeline card to update tasks without re-creating them.
              - **Compact & Highly Editable Deep Study Engine**: Compact study card with inline edit dialog to directly adjust logged study minutes, customize daily study targets, and quick-add study sessions (+15m, +25m, +45m, +60m, or custom).
              
              #### Direct Download & Testing:
              1. Download **\`zenith90-debug.apk\`** on your Android device.
              2. Open file and confirm install (allow 'Install Unknown Apps' if prompted).
              3. Launch **Zenith90**!" \
              --prerelease

            # Also update v1.6.0-pixel for backwards compatibility
            gh release delete v1.6.0-pixel --yes || true
            gh release create v1.6.0-pixel ./zenith90-debug.apk \
              --title "Zenith90 v1.7.0 Pixel (Material You Monet & Circle Fill)" \
              --notes "Updated to Zenith90 v1.7.0 with Material You dynamic color, circular filling summary, compact blueprint editor, and editable study section." \
              --prerelease

            # Also update v1.5.0-pixel for backwards compatibility
            gh release delete v1.5.0-pixel --yes || true
            gh release create v1.5.0-pixel ./zenith90-debug.apk \
              --title "Zenith90 v1.6.0 Pixel (Botanical Timezy Redesign)" \
              --notes "Updated to Zenith90 v1.6.0 with Botanical Timezy redesign, animations, haptics, and notifications." \
              --prerelease

            # Also update v1.4.0-pixel for backwards compatibility
            gh release delete v1.4.0-pixel --yes || true
            gh release create v1.4.0-pixel ./zenith90-debug.apk \
              --title "Zenith90 v1.5.0 Pixel (Material You & Gaming Vault)" \
              --notes "Updated to Zenith90 v1.5.0 with Material You dynamic color, haptic sliders, Pillar II boost verification, dedicated blueprint page, and PUBG/Free Fire rank badges." \
              --prerelease

            # Also update previous tags for backwards compatibility
            gh release delete v1.3.0-pixel --yes || true
            gh release create v1.3.0-pixel ./zenith90-debug.apk \
              --title "Zenith90 v1.4.0 Pixel Preview (Debug APK)" \
              --notes "Updated to Zenith90 v1.4.0 with comprehensive updates across all 7 pillars." \
              --prerelease

            # Also update v1.2.0-pixel and v1.0.0-preview for backwards-compatible download links
            gh release delete v1.2.0-pixel --yes || true
            gh release create v1.2.0-pixel ./zenith90-debug.apk \
              --title "Zenith90 v1.3.0 Pixel Preview (Debug APK)" \
              --notes "Updated to Zenith90 v1.3.0 with Brand Logo, Google Sign-In & Guest Mode." \
              --prerelease
            
            # Also update v1.0.0-preview for backwards-compatible download links
            gh release delete v1.0.0-preview --yes || true
            gh release create v1.0.0-preview ./zenith90-debug.apk \
              --title "Zenith90 v1.2.0 Preview (Debug APK)" \
              --notes "Updated to Zenith90 v1.2.0 with Firebase & Material 3." \
              --prerelease
          else
            echo "Error: APK not found!"
            exit 1
          fi
