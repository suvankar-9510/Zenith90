name: Build Zenith90 Instant Pixel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Zenith90 Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Downloadable Zenith90-Pixel.apk
        uses: actions/upload-artifact@v4
        with:
          name: Zenith90-Pixel-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish Test APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Found APK at $APK_PATH"
            cp "$APK_PATH" ./zenith90-debug.apk
            
            # Publish to v1.2.0-pixel release
            gh release delete v1.2.0-pixel --yes || true
            gh release create v1.2.0-pixel ./zenith90-debug.apk \
              --title "Zenith90 v1.2.0 Pixel Preview (Debug APK)" \
              --notes "### ⚡ Zenith90 v1.2.0 Instant Pixel APK
              
              Automated build compiled via GitHub Actions.
              
              #### What's Included:
              - **Material 3 Pixel OLED Design**: True obsidian theme with tactile haptics & adaptive icon.
              - **Firebase Auth & Cloud Sync**: Seamless login, register, cloud synchronization & offline bypass.
              - **Workout Tracker**: Log sets, reps, and loads for Gym Hypertrophy & Calisthenics.
              - **Study Habit Booster**: Focus Pomodoro timer and quick +25m/+50m increments.
              - **Immutable Vault**: 120-day heatmap, milestone badges & daily 1-line audit logs.
              
              #### Direct Download & Testing:
              1. Download **\`zenith90-debug.apk\`** on your Android device.
              2. Open file and confirm install (allow 'Install Unknown Apps' if prompted).
              3. Launch **Zenith90**!" \
              --prerelease
            
            # Also update v1.0.0-preview for backwards-compatible download links
            gh release delete v1.0.0-preview --yes || true
            gh release create v1.0.0-preview ./zenith90-debug.apk \
              --title "Zenith90 v1.2.0 Preview (Debug APK)" \
              --notes "Updated to Zenith90 v1.2.0 with Firebase & Material 3." \
              --prerelease
          else
            echo "Error: APK not found!"
            exit 1
          fi
